# Render Blueprint: New → Blueprint → pick this repo.
services:
  - type: web
    name: snip
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Random secret generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Free instances have no persistent disk: seed a demo account on every boot.
      - key: DEMO_MODE
        value: "true"
